{{- if .Values.externalSecret.enabled }}
{{/*
Projects every credential and every employer-identifying value from the vault
into the one Secret the workloads read. The chart never templates a credential
value; it only names vault entries, which are safe to publish.

Not a Helm hook: nothing in this release runs as a hook, so the Secret only has
to exist before the first pod starts, which the main phase guarantees.
*/}}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "afas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afas.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ include "afas.fullname" . }}
    # Owner, so deleting this ExternalSecret takes the derived Secret with it.
    # A credential left behind after its source is gone is one nobody rotates.
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    {{- range $envVar, $ref := .Values.externalSecret.data }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
