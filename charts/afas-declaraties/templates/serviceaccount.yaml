{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "afas.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afas.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role, no RoleBinding, no projected token: nothing here calls the
# Kubernetes API. The account exists so the workloads are not `default`, which
# other things in the namespace may be bound to.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
